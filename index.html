<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luma · your reading life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F4F0E8'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' text-anchor='middle' fill='%2325231F'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-inner">
    <button class="wordmark" data-action="nav" data-view="shelves">Luma</button>
    <nav class="nav" aria-label="Main">
      <button class="nav-link" data-action="nav" data-view="shelves">Your shelves</button>
      <button class="nav-link" data-action="nav" data-view="find">Find a book</button>
      <button class="nav-link" data-action="nav" data-view="community">Community</button>
    </nav>
    <div class="reader-badge" title="Eleanor Voss">EV</div>
  </div>
</header>

<main class="page">
  <section class="view" id="view-shelves"></section>
  <section class="view" id="view-find" hidden></section>
  <section class="view" id="view-community" hidden></section>
</main>

<footer class="colophon">
  <div class="colophon-inner">
    <div class="colophon-mark">Luma</div>
    <p>A reading companion for people who arrange their lives around books.</p>
    <p class="colophon-fine">Set in Fraunces and Source Sans 3 · paper, ink, and shelf dust · MMXXVI</p>
  </div>
</footer>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
